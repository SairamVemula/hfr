[workspace]
resolver = "2"
members = ["crates/proto", "crates/agent", "crates/core", "crates/cli", "crates/gui"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SairamVemula/hfr"
authors = ["Sairam Vemula and HFR Remote contributors"]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

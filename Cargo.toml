[workspace]
resolver = "2"
members = ["crates/proto", "crates/agent", "crates/core", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
